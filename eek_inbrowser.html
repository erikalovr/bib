  <style>
  /* Eek's built-in browser view */
  #eek-browser-shell{position:fixed;inset:0;z-index:2147483000;display:none;flex-direction:column;background:#090811;color:#f7f4ff;font-family:Sora,system-ui,sans-serif}
  #eek-browser-shell.eek-open{display:flex}
  #eek-browser-toolbar{display:flex;align-items:center;gap:9px;min-height:66px;padding:10px 14px;background:rgba(13,11,22,.98);border-bottom:1px solid rgba(190,160,255,.17);box-shadow:0 8px 28px rgba(0,0,0,.24)}
  .eek-browser-control{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border:1px solid rgba(190,160,255,.18);border-radius:12px;background:#191526;color:#e9e2ff;font-size:17px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
  .eek-browser-control:hover{background:#29213b;border-color:rgba(190,160,255,.45);transform:translateY(-1px)}
  .eek-browser-control:disabled{opacity:.32;cursor:not-allowed;transform:none}
  #eek-browser-address-wrap{display:flex;align-items:center;gap:9px;flex:1;min-width:0;height:42px;padding:0 13px;border:1px solid rgba(190,160,255,.2);border-radius:14px;background:#100e19}
  #eek-browser-address-wrap:focus-within{border-color:#a879ff;box-shadow:0 0 0 3px rgba(168,121,255,.13)}
  #eek-browser-lock{font-size:13px;color:#9d8bbf}
  #eek-browser-address{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f7f4ff;font:13px 'JetBrains Mono',monospace}
  #eek-browser-address::placeholder{color:#827995}
  #eek-browser-stage{position:relative;display:flex;flex:1;min-height:0;background:#fff}
  #eek-browser-frame{display:block;width:100%;height:100%;border:0;background:#fff}
  #eek-browser-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;padding:6px 14px;background:#0d0b16;border-top:1px solid rgba(190,160,255,.12);color:#a99fba;font:11px 'JetBrains Mono',monospace}
  #eek-browser-status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #eek-browser-fallback{display:none;align-items:center;justify-content:center;flex:1;padding:28px;background:radial-gradient(ellipse at 50% 35%,#241832 0%,#100d19 60%,#090811 100%);color:#f7f4ff;text-align:center}
  #eek-browser-fallback-card{width:min(560px,100%);padding:30px;border:1px solid rgba(190,160,255,.2);border-radius:24px;background:rgba(20,16,30,.88);box-shadow:0 24px 70px rgba(0,0,0,.35)}
  #eek-browser-fallback h2{margin:0 0 10px;font-size:23px;font-weight:600;letter-spacing:-.03em}
  #eek-browser-fallback p{margin:0 auto 18px;max-width:460px;color:#b7adc8;font-size:13px;line-height:1.7}
  .eek-browser-action{display:inline-flex;align-items:center;justify-content:center;min-height:40px;margin:4px;padding:0 15px;border:1px solid rgba(190,160,255,.24);border-radius:12px;background:#201832;color:#f8f4ff;font:600 12px Sora,system-ui,sans-serif;cursor:pointer}
  .eek-browser-action.primary{border-color:#9b6cff;background:linear-gradient(135deg,#8251df,#ae70ff)}
  .eek-browser-action:hover{filter:brightness(1.12)}
  @media(max-width:640px){#eek-browser-toolbar{gap:6px;padding:8px}.eek-browser-control{flex-basis:34px;width:34px;height:36px}#eek-browser-address-wrap{height:38px;padding:0 9px}#eek-browser-foot{font-size:10px}}
</style>

  <body>
    <div id="root"></div>
    <div id="eek-browser-shell" aria-label="Eek built-in browser" aria-hidden="true">
        <div id="eek-browser-toolbar">
          <button class="eek-browser-control" id="eek-browser-back" type="button" title="Back" aria-label="Back" disabled>←</button>
          <button class="eek-browser-control" id="eek-browser-forward" type="button" title="Forward" aria-label="Forward" disabled>→</button>
          <button class="eek-browser-control" id="eek-browser-reload" type="button" title="Reload" aria-label="Reload">↻</button>
          <button class="eek-browser-control" id="eek-browser-home" type="button" title="Back to Eek" aria-label="Back to Eek">⌂</button>
          <form id="eek-browser-address-wrap" autocomplete="off">
            <span id="eek-browser-lock" aria-hidden="true">◎</span>
            <input id="eek-browser-address" type="text" spellcheck="false" placeholder="Search or enter a website address" aria-label="Website address" />
          </form>
          <button class="eek-browser-control" id="eek-browser-external" type="button" title="Open outside Eek" aria-label="Open outside Eek">↗</button>
          <button class="eek-browser-control" id="eek-browser-close" type="button" title="Close browser view" aria-label="Close browser view">×</button>
        </div>
        <div id="eek-browser-stage">
          <iframe id="eek-browser-frame" title="Website opened inside Eek" referrerpolicy="no-referrer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-presentation"></iframe>
          <div id="eek-browser-fallback">
            <div id="eek-browser-fallback-card">
              <h2 id="eek-browser-fallback-title">This site won't open inside Eek</h2>
              <p id="eek-browser-fallback-message">Some websites block being displayed inside another website. That's a rule set by the site itself, so Eek can't override it in a standalone HTML file.</p>
              <button class="eek-browser-action primary" id="eek-browser-youtube-open" type="button">Open this site in a new tab ↗</button>
              <button class="eek-browser-action" id="eek-browser-return" type="button">Back to Eek</button>
            </div>
          </div>
        </div>
        <div id="eek-browser-foot">
          <span id="eek-browser-status">Eek in-app view · Some websites block embedding</span>
          <span>Private view · No proxy</span>
        </div>
      </div>
      <script>
      (function () {
        const shell = document.getElementById('eek-browser-shell');
        const frame = document.getElementById('eek-browser-frame');
        const address = document.getElementById('eek-browser-address');
        const fallback = document.getElementById('eek-browser-fallback');
        const status = document.getElementById('eek-browser-status');
        const backButton = document.getElementById('eek-browser-back');
        const forwardButton = document.getElementById('eek-browser-forward');
        let visits = [];
        let visitIndex = -1;
        let currentAddress = '';
    
        function normaliseAddress(value) {
          const text = String(value || '').trim();
          if (!text) return '';
          if (/^https?:\/\//i.test(text)) return text;
          if (/^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(text) || /^localhost(:\d+)?(\/.*)?$/i.test(text)) return (text.startsWith('localhost') ? 'http://' : 'https://') + text;
          return 'https://duckduckgo.com/?q=' + encodeURIComponent(text);
        }
    
        function isYouTube(url) {
          try { return /(^|\.)youtube\.com$|(^|\.)youtube-nocookie\.com$|(^|\.)youtu\.be$/i.test(new URL(url).hostname); }
          catch (_) { return false; }
        }
    
        function youtubeEmbed(url) {
          try {
            const parsed = new URL(url);
            const host = parsed.hostname.toLowerCase();
            let videoId = '';
            if (host === 'youtu.be' || host.endsWith('.youtu.be')) videoId = parsed.pathname.split('/').filter(Boolean)[0] || '';
            if (parsed.pathname === '/watch') videoId = parsed.searchParams.get('v') || '';
            const pathMatch = parsed.pathname.match(/^\/(?:shorts|live|embed)\/([\w-]{11})/);
            if (!videoId && pathMatch) videoId = pathMatch[1];
            if (videoId && /^[\w-]{11}$/.test(videoId)) return 'https://www.youtube-nocookie.com/embed/' + videoId;
            const playlistId = parsed.searchParams.get('list');
            if (playlistId && (parsed.pathname === '/playlist' || parsed.pathname === '/watch')) return 'https://www.youtube-nocookie.com/embed/videoseries?list=' + encodeURIComponent(playlistId);
          } catch (_) {}
          return '';
        }
    
        function updateButtons() {
          backButton.disabled = visitIndex <= 0;
          forwardButton.disabled = visitIndex < 0 || visitIndex >= visits.length - 1;
        }
    
        function showFallback(title, message, buttonLabel) {
          frame.style.display = 'none';
          fallback.style.display = 'flex';
          document.getElementById('eek-browser-fallback-title').textContent = title;
          document.getElementById('eek-browser-fallback-message').textContent = message;
          document.getElementById('eek-browser-youtube-open').textContent = buttonLabel || 'Open this site in a new tab ↗';
        }
    
        function showFrame(url, displayAddress) {
          const yt = isYouTube(url);
          if (yt) {
            const embed = youtubeEmbed(url);
            if (embed) {
              fallback.style.display = 'none';
              frame.style.display = 'block';
              frame.src = embed;
              status.textContent = 'YouTube video player · Embedded video mode';
              return;
            }
            showFallback(
              'YouTube does not allow its full website inside Eek',
              'YouTube blocks its homepage and search pages from being displayed inside other websites. Eek can play supported YouTube video links inside this window, but the full YouTube site must open in a normal tab.',
              'Open YouTube in a new tab ↗'
            );
            status.textContent = 'YouTube full-site embedding is blocked by YouTube';
            return;
          }
          fallback.style.display = 'none';
          frame.style.display = 'block';
          let target = url;
          try {
            const parsed = new URL(url);
            if (parsed.hostname === 'www.google.com' && parsed.pathname === '/search' && !parsed.searchParams.has('igu')) parsed.searchParams.set('igu', '1');
            target = parsed.toString();
          } catch (_) {}
          frame.src = target;
          status.textContent = 'Trying to load inside Eek · Some websites block embedded pages';
        }
    
        function openInternal(rawUrl, addToHistory) {
          const url = normaliseAddress(rawUrl);
          if (!url) return;
          try {
            const parsed = new URL(url);
            if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return;
          } catch (_) { return; }
          currentAddress = url;
          address.value = url;
          shell.classList.add('eek-open');
          shell.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
          if (addToHistory !== false) {
            visits = visits.slice(0, visitIndex + 1);
            visits.push(url);
            visitIndex = visits.length - 1;
          }
          showFrame(url, url);
          updateButtons();
        }
    
        function closeBrowser() {
          shell.classList.remove('eek-open');
          shell.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
          frame.src = 'about:blank';
        }
    
        window.__eekOpenInternal = function (url) { openInternal(url, true); };
    
        document.getElementById('eek-browser-address-wrap').addEventListener('submit', function (event) {
          event.preventDefault();
          openInternal(address.value, true);
        });
        document.getElementById('eek-browser-reload').addEventListener('click', function () {
          if (currentAddress) showFrame(currentAddress, currentAddress);
        });
        backButton.addEventListener('click', function () {
          if (visitIndex > 0) { visitIndex--; currentAddress = visits[visitIndex]; address.value = currentAddress; showFrame(currentAddress, currentAddress); updateButtons(); }
        });
        forwardButton.addEventListener('click', function () {
          if (visitIndex < visits.length - 1) { visitIndex++; currentAddress = visits[visitIndex]; address.value = currentAddress; showFrame(currentAddress, currentAddress); updateButtons(); }
        });
        document.getElementById('eek-browser-close').addEventListener('click', closeBrowser);
        document.getElementById('eek-browser-home').addEventListener('click', closeBrowser);
        document.getElementById('eek-browser-return').addEventListener('click', closeBrowser);
        document.getElementById('eek-browser-external').addEventListener('click', function () {
          if (currentAddress) window.open(currentAddress, '_blank', 'noopener,noreferrer');
        });
        document.getElementById('eek-browser-youtube-open').addEventListener('click', function () {
          if (currentAddress) window.open(currentAddress, '_blank', 'noopener,noreferrer');
        });
        document.addEventListener('keydown', function (event) {
          if (!shell.classList.contains('eek-open')) return;
          if (event.key === 'Escape') closeBrowser();
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'l') { event.preventDefault(); address.focus(); address.select(); }
        });
        frame.addEventListener('load', function () {
          if (frame.style.display !== 'none' && currentAddress && !isYouTube(currentAddress)) status.textContent = 'In-app view · If the page is blank, that site may block embedding';
        });
      })();
      </script>
  </body>
</html>
